<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
/*FONTS*/
:root{
  --bg:#0f1114; --panel:#1a1d22; --line:#2f343c; --fg:#efe6d2; --muted:#9a9384; --gold:#ffc23d;
  --display:'Fell','IM Fell English SC',Georgia,serif;
  --ui:'Anton',Impact,'Arial Narrow',sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--display)}
.app{min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:10px;
  padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{width:100%;max-width:460px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:26px;margin:0;color:var(--gold)}
.sub{font-size:13px;color:var(--muted);letter-spacing:.1em}
/* 9:16 stage, scaled to fit both width and height */
.stage{position:relative;width:min(100%,460px,calc((100vh - 250px) * .5625));min-width:180px;aspect-ratio:9/16;
  border-radius:12px;overflow:hidden;background:#000;box-shadow:0 18px 50px rgba(0,0,0,.6),0 0 0 1px var(--line)}
#sv{display:block;width:100%;height:100%}
.start{position:absolute;inset:0;width:100%;border:0;margin:0;padding:24px;cursor:pointer;font:inherit;color:var(--fg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
  background:radial-gradient(ellipse at 50% 45%,rgba(10,12,14,.2),rgba(10,12,14,.85))}
.start .t{font-family:'Fraktur',var(--display);font-size:clamp(40px,13vw,64px);line-height:.95;color:var(--gold);text-shadow:0 3px 0 #000,0 0 24px rgba(0,0,0,.7)}
.start .s{font-size:15px;letter-spacing:.16em;text-shadow:0 2px 6px #000}
.start .play{width:76px;height:76px;border-radius:50%;background:var(--gold);color:#1a120c;display:grid;place-items:center;box-shadow:0 8px 28px rgba(0,0,0,.55)}
.start .hint{font-family:var(--ui);font-size:12px;letter-spacing:.14em;opacity:.75}
.start[hidden]{display:none!important}
.controls{width:100%;max-width:460px;display:grid;grid-template-columns:auto auto auto minmax(0,1fr) auto;gap:10px;align-items:center}
button.ic{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--fg);display:grid;place-items:center;cursor:pointer;padding:0}
button.ic:hover{border-color:var(--gold);color:var(--gold)}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--gold);outline-offset:2px}
input[type=range]{width:100%;min-width:0;accent-color:var(--gold);margin:0}
.time{font-family:var(--ui);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.row2{width:100%;max-width:460px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-family:var(--ui);font-size:12px;letter-spacing:.08em;color:var(--muted)}
.row2 label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.file{border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--panel);color:var(--fg)}
.file input{position:absolute;width:1px;height:1px;opacity:0}
.now{width:100%;max-width:460px;margin:0;font-size:14px;line-height:1.45;min-height:3em}
.now b{font-family:var(--ui);font-weight:400;color:var(--gold);letter-spacing:.06em;margin-right:6px}
.foot{width:100%;max-width:460px;margin:0;font-size:12.5px;color:var(--muted);line-height:1.45}
body.export .app{padding:0;gap:0;display:block}
body.export .app>*:not(.stage){display:none}
body.export .stage{width:1080px;height:1920px;border-radius:0;box-shadow:none;min-width:0}
</style>
</head>
<body>
<div class="app">
  <header><h1>{{TITLE}}</h1><span class="sub">{{SUB}}</span></header>
  <div class="stage" id="stage">
    <svg id="sv" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid meet" role="img" aria-label="{{ARIA}}">
      <defs>
{{DEFS}}
      </defs>
      <g id="world"></g>
      <rect width="1080" height="1920" fill="url(#gVig)" pointer-events="none"/>
      <g id="caps"></g>
      <rect id="flash" width="1080" height="1920" fill="#fff" opacity="0" pointer-events="none"/>
    </svg>
    <button class="start" id="start" type="button" aria-label="Play with sound">
      <span class="t">{{TITLE}}</span>
      <span class="s">{{SUB}}</span>
      <span class="play"><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg></span>
      <span class="hint">TAP TO PLAY · SOUND ON</span>
    </button>
  </div>
  <div class="controls">
    <button class="ic" id="pp" type="button" aria-label="Play"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path id="ppi" d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg></button>
    <button class="ic" id="rs" type="button" aria-label="Restart"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5a7 7 0 1 1-6.6 4.7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M4 4v6h6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="ic" id="mu" type="button" aria-label="Mute"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path id="mui" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <input id="scrub" type="range" min="0" max="55.5" step="0.01" value="0" aria-label="Seek">
    <span class="time" id="tm">0:00.0 / 0:55.5</span>
  </div>
  <div class="row2">
    <label><input type="checkbox" id="loop" checked> LOOP</label>
    <label class="file" title="Replace the narration with your own recording (stays in your browser)">REPLACE NARRATION<input type="file" id="narr" accept="audio/*"></label>
    <span id="narrState">No narration attached</span>
  </div>
  <p class="now" id="now"></p>
  <p class="foot">{{FOOT}}</p>
</div>

<script>
(() => {
'use strict';
/* =====================================================================
   TIMING — the single source of truth.
   Each shot: start (s), narration line, captions (seconds after shot start),
   sound cues (seconds after shot start). Edit these to re-time the film.
   AUDIO HOOK: when a narration recording exists, set NARRATION_URL below
   (or use the "Load narration audio" button) and re-time the shot starts
   to the recording. The animation clock then follows the audio element.
   ===================================================================== */
const VO = /*VO*/null;          // generated from the voice track: shots, lines (speaker, start, word times, mouth envelope)
const VOICE_SRC = '/*VOICE*/';  // embedded narration + dialogue (AI voices). Swap with the "Replace narration" button or edit here.
{{META}}
const SHOTS = VO.shots.map((s,i)=>({n:i+1, start:s.start, lines:s.lines, words:s.lines.flatMap(l=>l.words.map(w=>({...w,spk:l.spk}))),
  narr:s.lines.map(l=>(l.spk==='N'?'':SPEAKERS[l.spk].name+': ')+l.words.map(w=>w.w).join(' ')).join('   '), ...SHOT_META[i]}));
const TOTAL = VO.total;
const S = n => SHOTS[n-1].start;
const SE = n => n < SHOTS.length ? SHOTS[n].start : TOTAL;   // end of shot n
const normW = w => w.toLowerCase().replace(/[^a-z0-9']/g,'');
function cue(n,prefix){ const p=normW(prefix), w=SHOTS[n-1].words.find(w=>normW(w.w).startsWith(p)); if(!w) throw new Error(`no word "${prefix}" in shot ${n}`); return w.t; }
const cu = (n,prefix) => cue(n,prefix)-S(n);   // word time, in seconds after its shot starts

/* ============================== utilities */
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,k)=>a+(b-a)*k, sat=k=>clamp(k,0,1), rad=d=>d*Math.PI/180;
const E={ io:k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2, o:k=>1-Math.pow(1-k,3), i:k=>k*k*k, lin:k=>k,
  back:k=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2);} };
const seg=(u,a,b,e=E.io)=>e(sat((u-a)/(b-a)));
const N=v=>Math.round(v*10)/10;
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};
const OUT='#1b130d';
function mix(a,b,k){
  if(a===undefined) return b; if(b===undefined) return a;
  if(typeof a==='number'&&typeof b==='number') return lerp(a,b,k);
  if(Array.isArray(a)&&Array.isArray(b)) return a.map((v,i)=>mix(v,b[i],k));
  if(a&&b&&typeof a==='object'&&typeof b==='object'){ const o={}; for(const key of new Set([...Object.keys(a),...Object.keys(b)])) o[key]=mix(a[key],b[key],k); return o; }
  return k<.5?a:b;
}
/* keyed interpolation: keys = [[time, value, easing?], ...] */
function keys(u,ks){
  if(u<=ks[0][0]) return ks[0][1];
  for(let i=1;i<ks.length;i++){ if(u<=ks[i][0]){ const [t0,v0]=ks[i-1],[t1,v1,e]=ks[i]; return mix(v0,v1,(e||E.io)(sat((u-t0)/(t1-t0)))); } }
  return ks[ks.length-1][1];
}
function smooth(p,closed=true){
  const n=p.length, P=i=>p[closed?(i+n)%n:clamp(i,0,n-1)]; let d=`M${N(p[0][0])} ${N(p[0][1])}`;
  for(let i=0;i<(closed?n:n-1);i++){const a=P(i-1),b=P(i),c=P(i+1),e=P(i+2);
    d+=`C${N(b[0]+(c[0]-a[0])/6)} ${N(b[1]+(c[1]-a[1])/6)} ${N(c[0]-(e[0]-b[0])/6)} ${N(c[1]-(e[1]-b[1])/6)} ${N(c[0])} ${N(c[1])}`;}
  return d+(closed?'Z':'');
}
function mixHex(a,b,k){ const A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16),f=s=>Math.round(lerp((A>>s)&255,(B>>s)&255,k)); return '#'+((1<<24)+(f(16)<<16)+(f(8)<<8)+f(0)).toString(16).slice(1); }
function shade(hex,k){ const n=parseInt(hex.slice(1),16); const f=c=>clamp(Math.round(c*k),0,255); return '#'+((1<<24)+(f(n>>16)<<16)+(f(n>>8&255)<<8)+f(n&255)).toString(16).slice(1); }
const memo=(()=>{const m=new Map();return (k,fn)=>{ if(!m.has(k)) m.set(k,fn()); return m.get(k); };})();

/* ============================== camera */
const camT=c=>`translate(540 960) scale(${N(c.z*1000)/1000}) translate(${N(-c.x)} ${N(-c.y)})`;
function layer(cam,home,p,svg){
  const c={x:home.x+(cam.x-home.x)*p, y:home.y+(cam.y-home.y)*p, z:home.z*Math.pow(cam.z/home.z,p)};
  return `<g transform="${camT(c)}">${svg}</g>`;
}
const sky=id=>`<rect x="-10" y="-10" width="1100" height="1940" fill="url(#${id})"/>`;

/* ============================== rig: two-bone IK */
const DBG={maxGrip:0, gripAt:0};
function ik(a,b,L1,L2,bend){
  const dx=b[0]-a[0], dy=b[1]-a[1], d=Math.hypot(dx,dy)||1e-6;
  const dc=clamp(d,Math.abs(L1-L2)+1,L1+L2-.5), ang=Math.atan2(dy,dx);
  const A=Math.acos(clamp((L1*L1+dc*dc-L2*L2)/(2*L1*dc),-1,1));
  return {a, j:[a[0]+L1*Math.cos(ang+bend*A), a[1]+L1*Math.sin(ang+bend*A)], e:[a[0]+dc*Math.cos(ang), a[1]+dc*Math.sin(ang)], err:Math.max(0,d-dc)};
}
const pth=pts=>'M'+pts.map(p=>N(p[0])+' '+N(p[1])).join('L');
function limb(pts,w,col){ const d=pth(pts);
  return `<path d="${d}" fill="none" stroke="${OUT}" stroke-width="${w+7}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`; }

{{COS}}

/* ============================== figure */
function fig(who,x,y,s,face,p,t,seed=0,extra=''){
  let c=COS[who]; if(p.sick>0) c={...c,skin:mixHex(c.skin,'#a9bd82',p.sick)};
  const lean=p.lean||0, hip=[p.hx||0,-150+(p.hy||0)];
  const U=[Math.sin(rad(lean)),-Math.cos(rad(lean))], Nn=[-U[1],U[0]];
  const neck=[hip[0]+U[0]*112,hip[1]+U[1]*112];
  const sh=[neck[0]-U[0]*14, neck[1]-U[1]*14-(p.shrug||0)];
  const ht=lean+(p.tilt||0), HU=[Math.sin(rad(ht)),-Math.cos(rad(ht))];
  const hs=c.headS||1, hc=[neck[0]+HU[0]*38*hs, neck[1]+HU[1]*38*hs-(p.shrug||0)*.4];
  let hB=p.hB||[-6,-132], hF=p.hF||[8,-132], rf=null;
  if(p.rifle){ const r=p.rifle, ca=Math.cos(rad(r.a)), sa=Math.sin(rad(r.a)); const pt=g=>[r.x+ca*g, r.y+sa*g];
    rf=r; const rB=r.relB||0, rF=r.relF||0; if(r.gF!=null) hF=mix(pt(r.gF),hF,rF); if(r.gB!=null) hB=mix(pt(r.gB),hB,rB); }
  if(p.gripF) hF=p.gripF; if(p.gripB) hB=p.gripB;
  const aB=ik(sh,hB,62,60,1), aF=ik(sh,hF,62,60,1);
  if(rf||p.gripF||p.gripB){ const gb=p.gripB||(rf&&rf.gB!=null&&(rf.relB||0)<.02), gf=p.gripF||(rf&&rf.gF!=null&&(rf.relF||0)<.02); const e=Math.max(gb?aB.err:0, gf?aF.err:0); if(e>DBG.maxGrip){DBG.maxGrip=e;DBG.gripAt=DBG.now;DBG.who=who;} if(e>2&&DBG.log) DBG.log.push([N(DBG.now),who,N(e)]); }
  const lB=ik(hip,p.fB||STANCE.fB,80,78,-1), lF=ik(hip,p.fF||STANCE.fF,80,78,-1);
  const sleeve=c.bare?c.skin:(c.coat||c.shirt), dk=k=>shade(k,.72);
  let g=p.noShadow?"":`<ellipse cx="${N((hip[0])*.6)}" cy="3" rx="74" ry="11" fill="#000" opacity=".2"/>`;
  if(c.wings) g+=wingSvg(c,sh,lean,p.wing||0);
  if(c.cape){ const sw=Math.sin((t||0)*3+seed)*6+(p.capeSw||0); g+=`<path d="M${N(sh[0]-16)} ${N(sh[1]-4)}L${N(sh[0]+14)} ${N(sh[1]-4)}Q${N(hip[0]-10+sw)} ${N(hip[1]+40)} ${N(hip[0]-30+sw)} -24L${N(hip[0]-96+sw*1.6)} -14Q${N(hip[0]-70)} ${N(hip[1])} ${N(sh[0]-16)} ${N(sh[1]-4)}Z" fill="${c.cape}" stroke="${OUT}" stroke-width="5" stroke-linejoin="round"/>`; }
  const armSvg=(A,back)=>limb([A.a,A.j,A.e],13,back?dk(sleeve):sleeve)+`<circle cx="${N(A.e[0])}" cy="${N(A.e[1])}" r="9.5" fill="${back?dk(c.skin):c.skin}" stroke="${OUT}" stroke-width="4"/>`;
  const legSvg=(L,back)=>{ const col=back?dk(c.pants):c.pants, f=L.e;
    return (c.shorts?limb([L.a,L.j],16,back?dk(c.shorts):c.shorts)+limb([L.j,L.e],13,back?dk(c.skin):c.skin):limb([L.a,L.j,L.e],15,col))+`<path d="M${N(f[0]-11)} ${N(f[1]-15)}L${N(f[0]+9)} ${N(f[1]-15)}Q${N(f[0]+27)} ${N(f[1]-12)} ${N(f[0]+27)} ${N(f[1]-1)}L${N(f[0]-11)} ${N(f[1])}Z" fill="${back?dk(c.boot):c.boot}" stroke="${OUT}" stroke-width="4" stroke-linejoin="round"/>`; };
  if(p.behind){ if(rf) g+=rifleSvg(rf,t); g+=armSvg(aB,true)+armSvg(aF,false); }
  g+=legSvg(lB,true)+legSvg(lF,false);
  g+=torsoSvg(c,hip,neck,U,Nn,lean,p);
  g+=headSvg(c,hc,ht,p,t,seed);
  if(!p.behind){ g+=armSvg(aB,true); if(rf) g+=rifleSvg(rf,t); if(p.scroll) g+=scrollSvg(aB.e,p.scroll); if(p.hatHand) g+=`<g transform="translate(${N(aB.e[0]+6)} ${N(aB.e[1]+30)}) rotate(-8)">${hatSvg(c,true)}</g>`+`<circle cx="${N(aB.e[0])}" cy="${N(aB.e[1])}" r="9.5" fill="${dk(c.skin)}" stroke="${OUT}" stroke-width="4"/>`; g+=armSvg(aF,false); }
  g+=extra;
  return `<g transform="translate(${N(x)} ${N(y)}) scale(${N(s*face*100)/100} ${N(s*100)/100})"${p.op!=null?` opacity="${N(p.op*100)/100}"`:''}>${g}</g>`;
}
function torsoSvg(c,hip,neck,U,Nn,lean,p){
  const at=(b,f,w)=>[b[0]+Nn[0]*w+U[0]*f, b[1]+Nn[1]*w+U[1]*f];
  const col=c.coat||c.shirt;
  const nf=at(neck,-6,19), nb=at(neck,-6,-18), wf=at(hip,0,18), wb=at(hip,0,-18), chest=at(neck,-40,27), back=at(neck,-50,-21);
  let d=`M${N(nb[0])} ${N(nb[1])}Q${N(neck[0]+U[0]*6)} ${N(neck[1]+U[1]*6)} ${N(nf[0])} ${N(nf[1])}Q${N(chest[0])} ${N(chest[1])} ${N(wf[0])} ${N(wf[1])}`;
  if(c.frock||c.tunic){ const L=c.frock?62:24; d+=`L${N(wf[0]+5)} ${N(wf[1]+L)}L${N(wb[0]-4)} ${N(wb[1]+L)}`; }
  d+=`L${N(wb[0])} ${N(wb[1])}Q${N(back[0])} ${N(back[1])} ${N(nb[0])} ${N(nb[1])}Z`;
  let g=`<path d="${d}" fill="${col}" stroke="${OUT}" stroke-width="5" stroke-linejoin="round"/>`;
  if(c.vest){ const v1=at(neck,-8,17), v2=at(hip,-6,16), v3=at(hip,-6,4), v4=at(neck,-16,6); g+=`<path d="M${N(v1[0])} ${N(v1[1])}L${N(v2[0])} ${N(v2[1])}L${N(v3[0])} ${N(v3[1])}L${N(v4[0])} ${N(v4[1])}Z" fill="${c.vest}" stroke="${OUT}" stroke-width="3"/>`;
    const k1=at(neck,-2,15),k2=at(neck,-20,18),k3=at(neck,-16,8); g+=`<path d="M${N(k1[0])} ${N(k1[1])}L${N(k2[0])} ${N(k2[1])}L${N(k3[0])} ${N(k3[1])}Z" fill="${c.shirt}" stroke="${OUT}" stroke-width="2.5"/>`; }
  if(c.braces){ for(const w of [9,-9]){ const a=at(neck,-8,w), b=at(hip,-2,w*.9); g+=`<path d="M${N(a[0])} ${N(a[1])}L${N(b[0])} ${N(b[1])}" stroke="${c.braces}" stroke-width="5" stroke-linecap="round"/>`; } }
  if(c.xbelt){ const a=at(neck,-10,-16), b=at(hip,-4,16); g+=`<path d="M${N(a[0])} ${N(a[1])}L${N(b[0])} ${N(b[1])}" stroke="${OUT}" stroke-width="10" stroke-linecap="round"/><path d="M${N(a[0])} ${N(a[1])}L${N(b[0])} ${N(b[1])}" stroke="${c.xbelt}" stroke-width="6" stroke-linecap="round"/>`;
    const w1=at(hip,6,-18), w2=at(hip,6,19); g+=`<path d="M${N(w1[0])} ${N(w1[1])}L${N(w2[0])} ${N(w2[1])}" stroke="${c.xbelt}" stroke-width="6"/>`; }
  if(c.belt){ const w1=at(hip,6,-18), w2=at(hip,6,19), bk=at(hip,6,14); g+=`<path d="M${N(w1[0])} ${N(w1[1])}L${N(w2[0])} ${N(w2[1])}" stroke="${c.belt}" stroke-width="7"/><rect x="${N(bk[0]-5)}" y="${N(bk[1]-5)}" width="10" height="10" fill="${c.btn}" stroke="${OUT}" stroke-width="1.5"/>`; }
  if(c.btn){ for(let i=0;i<4;i++){ const b=at(neck,-22-i*21,12); g+=`<circle cx="${N(b[0])}" cy="${N(b[1])}" r="3" fill="${c.btn}"/>`; } }
  if(c.bowtie){ const b=at(neck,-9,9); g+=`<path d="M${N(b[0]-13)} ${N(b[1]-8)}L${N(b[0])} ${N(b[1])}L${N(b[0]-13)} ${N(b[1]+8)}ZM${N(b[0]+13)} ${N(b[1]-8)}L${N(b[0])} ${N(b[1])}L${N(b[0]+13)} ${N(b[1]+8)}Z" fill="${c.bowtie}" stroke="${OUT}" stroke-width="2.6" stroke-linejoin="round"/><circle cx="${N(b[0])}" cy="${N(b[1])}" r="3.4" fill="${c.bowtie}" stroke="${OUT}" stroke-width="2"/>`; }
  if(c.epaulet){ const e=at(neck,-14,0); g+=`<ellipse cx="${N(e[0])}" cy="${N(e[1])}" rx="15" ry="6" fill="${c.epaulet}" stroke="${OUT}" stroke-width="3" transform="rotate(${N(lean)} ${N(e[0])} ${N(e[1])})"/>`; }
  return g;
}

    g=`<g opacity="${N(k*100)/100}" transform="translate(540 ${N(ty)}) rotate(-2)"><rect x="${N(-w/2)}" y="-34" width="${N(w)}" height="68" rx="14" fill="${sp.col}" stroke="${OUT}" stroke-width="6"/><text y="16" text-anchor="middle" font-family="Anton, Impact, sans-serif" font-size="${fs}" letter-spacing="3" fill="#fffaf0">${esc(sp.name)}</text></g>`+g; }
  return `<g>${g}</g>`;
}
function shotIndex(t){ let i=0; for(let k=0;k<SHOTS.length;k++) if(t>=SHOTS[k].start) i=k; return i; }

/* ============================== compositor: renderAt(t) sets the complete frame for any time */
const $=id=>document.getElementById(id);
const world=$('world'), capsEl=$('caps'), flashEl=$('flash'), whipBlur=$('whipBlur');
function seqAt(t){ let i=0; for(let k=0;k<SEQ.length;k++) if(t>=SEQ[k].start) i=k; return i; }
function composeAt(t){
  const i=seqAt(t), q=SEQ[i], prev=SEQ[i-1], next=SEQ[i+1];
  let blur=0, svg;
  const W={whip:.2, push:.36, dissolve:.45};
  if(next&&q.out==='whip'&&t>q.end-W.whip){ const k=.5*(t-(q.end-W.whip))/W.whip; blur=Math.sin(Math.PI*k)*80; svg=whipPair(q,next,t,k); }
  else if(prev&&prev.out==='whip'&&t<q.start+W.whip){ const k=.5+.5*(t-q.start)/W.whip; blur=Math.sin(Math.PI*k)*80; svg=whipPair(prev,q,t,k); }
  else if(next&&q.out==='push'&&t>q.end-W.push){ const k=.5*(t-(q.end-W.push))/W.push; svg=pushPair(q,next,t,k); }
  else if(prev&&prev.out==='push'&&t<q.start+W.push){ const k=.5+.5*(t-q.start)/W.push; svg=pushPair(prev,q,t,k); }
  else if(next&&q.out==='dissolve'&&t>q.end-W.dissolve){ const k=.5*(t-(q.end-W.dissolve))/W.dissolve; svg=q.r(t)+`<g opacity="${N(E.io(k)*100)/100}">${next.r(next.start)}</g>`; }
  else if(prev&&prev.out==='dissolve'&&t<q.start+W.dissolve){ const k=.5+.5*(t-q.start)/W.dissolve; svg=prev.r(prev.end-1e-3)+`<g opacity="${N(E.io(k)*100)/100}">${q.r(t)}</g>`; }
  else svg=q.r(t);
  if(blur>0) svg=`<g filter="url(#whip)">${svg}</g>`;
  return {svg, blur};
}
function whipPair(a,b,t,k){ const e=E.io(k), ta=Math.min(t,a.end-1e-3), tb=Math.max(t,b.start);
  return `<g transform="translate(${N(-e*1080)} 0)">${a.r(ta)}</g><g transform="translate(${N(1080-e*1080)} 0)">${b.r(tb)}</g>`; }
function pushPair(a,b,t,k){ const e=E.io(k), ta=Math.min(t,a.end-1e-3), tb=Math.max(t,b.start);
  return `<g transform="translate(${N(e*1080)} 0)">${a.r(ta)}</g><g transform="translate(${N(-1080+e*1080)} 0)">${b.r(tb)}</g><rect x="${N(-12+e*1080)}" y="0" width="24" height="1920" fill="#000" opacity=".25"/>`; }
function flashAt(t){ return 0; }
let lastFrameT=-1;
function renderAt(t){
  t=clamp(t,0,TOTAL-1e-4); DBG.now=t;
  const c=composeAt(t);
  whipBlur.setAttribute('stdDeviation',`${N(c.blur)} 0`);
  world.innerHTML=c.svg;
  capsEl.innerHTML=overlays(t)+subSvg(t);
  flashEl.setAttribute('opacity',N(flashAt(t)*100)/100);
  lastFrameT=t; updateNow(t);
}

/* ============================== sound: synthesized cue effects (no voice, no music) */
const A={ac:null,master:null,muted:false,noise:null};
function audioInit(){ if(A.ac) return true; const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return false;
  A.ac=new AC(); const sr=A.ac.sampleRate, b=A.ac.createBuffer(1,sr*2,sr), d=b.getChannelData(0); let s=7; for(let i=0;i<d.length;i++){ s=(s*16807)%2147483647; d[i]=s/1073741823.5-1; } A.noise=b; newMaster(); return true; }
function newMaster(){ if(A.master){ try{A.master.disconnect();}catch(e){} } A.master=A.ac.createGain(); A.master.gain.value=A.muted?0:SFX_GAIN; A.master.connect(A.ac.destination); }
const SFX_GAIN=.135;  // effects bus: about 10 dB under the narration (matches the MP4 mix)
function env(g,t0,a,h,r,pk){ g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(pk,t0+a); g.gain.setValueAtTime(pk,t0+a+h); g.gain.exponentialRampToValueAtTime(.0001,t0+a+h+r); }
function osc(type,f,t0,dur,pk,{a=.005,r=.1,f2=null,filt=null,q=1}={}){ const ac=A.ac,o=ac.createOscillator(),g=ac.createGain(); o.type=type; o.frequency.setValueAtTime(f,t0); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  env(g,t0,a,Math.max(0,dur-a-r),r,pk); let n=o; if(filt){ const bq=ac.createBiquadFilter(); bq.type=filt[0]; bq.frequency.value=filt[1]; bq.Q.value=q; o.connect(bq); n=bq; } n.connect(g); g.connect(A.master); o.start(t0); o.stop(t0+dur+.05); }
function nz(t0,dur,pk,{type='bandpass',f=1000,q=1,f2=null,a=.003,r=.08}={}){ const ac=A.ac,s=ac.createBufferSource(),bq=ac.createBiquadFilter(),g=ac.createGain(); s.buffer=A.noise; s.loop=true;
  bq.type=type; bq.frequency.setValueAtTime(f,t0); if(f2) bq.frequency.exponentialRampToValueAtTime(f2,t0+dur); bq.Q.value=q; env(g,t0,a,Math.max(0,dur-a-r),r,pk); s.connect(bq); bq.connect(g); g.connect(A.master); s.start(t0,.37); s.stop(t0+dur+.05); }
{{SFX}}
const CUES=SHOTS.flatMap(s=>s.sfx.map(c=>{ let t,name,dur; if(typeof c[0]==='string'){ t=cue(s.n,c[0].slice(1))+c[1]; name=c[2]; dur=c[3]; } else { t=s.start+c[0]; name=c[1]; dur=c[2]; }
  return {t,name,dur:dur==='toNext'?SE(s.n)-t:dur}; })).sort((a,b)=>a.t-b.t);
/* offline render of every effect cue, used for the MP4 export (narration is mixed separately) */
async function renderSfxOffline(sr=48000){
  const saved={ac:A.ac,master:A.master,noise:A.noise};
  const oc=new OfflineAudioContext(2,Math.ceil(sr*TOTAL),sr), nb=oc.createBuffer(1,sr*2,sr), d=nb.getChannelData(0); let sd=7; for(let i=0;i<d.length;i++){ sd=(sd*16807)%2147483647; d[i]=sd/1073741823.5-1; }
  A.ac=oc; A.noise=nb; A.master=oc.createGain(); A.master.gain.value=SFX_GAIN; A.master.connect(oc.destination);
  const errs=[]; for(const c of CUES){ try{ SFX[c.name](Math.max(.001,c.t),c.dur); }catch(e){ errs.push(c.name+': '+e.message); } }
  const buf=await oc.startRendering(); Object.assign(A,saved); return {buf,errs};
}
function fireCues(t0,t1){ if(!A.ac||A.ac.state!=='running') return; const now=A.ac.currentTime+.01;
  for(const c of CUES) if(c.t>t0&&c.t<=t1){ try{ SFX[c.name](now,c.dur); }catch(e){} } }

/* ============================== narration hook (optional, user-supplied) */
const NAR={el:null,name:''};
function attachNarration(src,name){ if(NAR.el){ NAR.el.pause(); }
  NAR.el=new Audio(src); NAR.el.preload='auto'; NAR.name=name; NAR.el.muted=A.muted;
  $('narrState').textContent='Narration: '+name;
  NAR.el.addEventListener('error',()=>{ $('narrState').textContent='Could not load narration: '+name; NAR.el=null; }); }
if(VOICE_SRC.startsWith('data:')) attachNarration(VOICE_SRC,'built-in voiceover');
$('narr').addEventListener('change',e=>{ const f=e.target.files&&e.target.files[0]; if(f) { attachNarration(URL.createObjectURL(f),f.name); if(NAR.el) NAR.el.currentTime=PL.t; if(PL.playing&&NAR.el) NAR.el.play().catch(()=>{}); } });

/* ============================== player */
const startBtn=$('start'), pp=$('pp'), ppi=$('ppi'), rs=$('rs'), mu=$('mu'), mui=$('mui'), scrub=$('scrub'), tm=$('tm'), loopEl=$('loop'), nowEl=$('now');
scrub.max=TOTAL.toFixed(2);
const fmt=s=>`${Math.floor(s/60)}:${(s%60).toFixed(1).padStart(4,'0')}`;
const PL={t:0,playing:false,last:0,dragging:false};
function setPlayIcon(){ ppi.setAttribute('d',PL.playing?'M7 5h3.5v14H7zM13.5 5H17v14h-3.5z':'M7 4.5v15l13-7.5z'); pp.setAttribute('aria-label',PL.playing?'Pause':'Play'); }
function setMuteIcon(){ mui.style.opacity=A.muted?0:1; mu.setAttribute('aria-label',A.muted?'Unmute':'Mute'); }
function updateUI(){ if(!PL.dragging) scrub.value=PL.t.toFixed(2); tm.textContent=`${fmt(PL.t)} / ${fmt(TOTAL)}`; }
let nowShot=-1;
function updateNow(t){ const i=shotIndex(t); if(i===nowShot) return; nowShot=i; const s=SHOTS[i]; nowEl.innerHTML=`<b>SHOT ${s.n}</b>${esc(s.narr)}`; }
function play(){
  if(PL.t>=TOTAL-.05) PL.t=0;
  startBtn.hidden=true;
  if(audioInit()){ A.ac.resume(); }
  if(NAR.el){ NAR.el.currentTime=PL.t; NAR.el.play().catch(()=>{}); }
  PL.playing=true; PL.last=performance.now(); setPlayIcon();
}
function pause(){ PL.playing=false; setPlayIcon(); if(A.ac) newMaster(); if(NAR.el) NAR.el.pause(); }
function seek(t){ PL.t=clamp(t,0,TOTAL); if(A.ac) newMaster(); if(NAR.el) NAR.el.currentTime=PL.t; renderAt(PL.t); updateUI(); }
startBtn.addEventListener('click',play);
pp.addEventListener('click',()=>PL.playing?pause():play());
rs.addEventListener('click',()=>{ seek(0); if(!PL.playing) play(); });
mu.addEventListener('click',()=>{ A.muted=!A.muted; if(A.master) A.master.gain.setTargetAtTime(A.muted?0:SFX_GAIN,A.ac.currentTime,.03); if(NAR.el) NAR.el.muted=A.muted; setMuteIcon(); });
scrub.addEventListener('input',()=>{ PL.dragging=true; startBtn.hidden=true; seek(parseFloat(scrub.value)); });
scrub.addEventListener('change',()=>{ PL.dragging=false; });
document.addEventListener('keydown',e=>{
  if(e.target===scrub&&(e.key==='ArrowLeft'||e.key==='ArrowRight')) return;
  if(e.code==='Space'||e.key==='k'){ e.preventDefault(); PL.playing?pause():play(); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); seek(PL.t+(e.shiftKey?.1:1)); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); seek(PL.t-(e.shiftKey?.1:1)); }
});
function frame(now){
  if(PL.playing){
    const prevT=PL.t;
    if(NAR.el&&!NAR.el.paused&&!NAR.el.ended&&NAR.el.currentTime<TOTAL){ PL.t=NAR.el.currentTime; }
    else PL.t+=Math.min(.1,(now-PL.last)/1000);
    PL.last=now;
    fireCues(prevT,PL.t);
    if(PL.t>=TOTAL){ if(loopEl.checked){ PL.t=0; if(A.ac) newMaster(); if(NAR.el){ NAR.el.currentTime=0; NAR.el.play().catch(()=>{}); } fireCues(-1,0); } else { PL.t=TOTAL; pause(); } }
    renderAt(PL.t); updateUI();
  }
  requestAnimationFrame(frame);
}
{{COVER}}
/* B2: every cut in the film (SEQ starts + in-shot cuts from CUT_EP), absolute seconds. Episodes without CUT_EP get the SEQ starts only. */
const CUTS=(()=>{ const c=SEQ.map(q=>q.start); if(typeof CUT_EP!=='undefined'&&typeof cutPts==='function') for(const n of Object.keys(CUT_EP)) for(const p of cutPts(+n)) c.push(S(+n)+p);
  return [...new Set(c.map(x=>+x.toFixed(3)))].sort((x,y)=>x-y); })();
window.film={renderCover,renderAt,TOTAL,SHOTS,SEQ,SUBS,CUES,DBG,seek,play,pause,state:PL,renderSfxOffline,CUTS,part:typeof part==='function'?part:null,
  CUT_OPT:typeof CUT_EP!=='undefined', CUT_HOLD:typeof CUT_HOLD_EP!=='undefined'?CUT_HOLD_EP:[],
  CAPS:{mode:typeof CAP_MODE!=='undefined'?CAP_MODE:'line', chunks:typeof BIGCAPS!=='undefined'?BIGCAPS:[], fit:typeof bigCapFit==='function'?bigCapFit:null, ok:typeof capOk==='function'?capOk:null, min:typeof BIGCAP!=='undefined'?BIGCAP.min:0}};
if(/[?&]export\b/.test(location.search)){ document.body.classList.add('export'); startBtn.hidden=true; }
function boot(){ mcache.clear(); renderAt(3.9); PL.t=0; updateUI(); setPlayIcon(); setMuteIcon(); requestAnimationFrame(frame); }
(document.fonts&&document.fonts.load?Promise.all(['100px Anton','40px Fell'].map(f=>document.fonts.load(f))).catch(()=>{}):Promise.resolve()).then(boot);
})();
</script>
